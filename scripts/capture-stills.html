<!doctype html>
<!-- Draws one fragment shader full-window for scripts/capture-stills.ts to screenshot.
     Same quad, uniforms and starting time (0) as src/lib/shaderPool.ts, so a still
     matches the first frame a live shader shows. Usage: ?src=/src/data/shaders/glsl/<name>.glsl -->
<html><head><meta charset="utf-8"><style>html,body{margin:0;height:100%;background:#000}canvas{display:block;width:100vw;height:100vh}</style></head>
<body><canvas id="c"></canvas>
<script>
(async () => {
  const c = document.getElementById('c')
  c.width = innerWidth; c.height = innerHeight
  const g = c.getContext('webgl', { preserveDrawingBuffer: true })
  const src = await (await fetch(new URLSearchParams(location.search).get('src'))).text()
  const sh = (type, s) => { const x = g.createShader(type); g.shaderSource(x, s); g.compileShader(x); if (!g.getShaderParameter(x, g.COMPILE_STATUS)) throw new Error(g.getShaderInfoLog(x)); return x }
  const p = g.createProgram()
  g.attachShader(p, sh(g.VERTEX_SHADER, 'attribute vec2 a_position;void main(){gl_Position=vec4(a_position,0.0,1.0);}'))
  g.attachShader(p, sh(g.FRAGMENT_SHADER, src))
  g.bindAttribLocation(p, 0, 'a_position'); g.linkProgram(p); g.useProgram(p)
  g.bindBuffer(g.ARRAY_BUFFER, g.createBuffer())
  g.bufferData(g.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), g.STATIC_DRAW)
  g.enableVertexAttribArray(0); g.vertexAttribPointer(0, 2, g.FLOAT, false, 0, 0)
  g.viewport(0, 0, c.width, c.height)
  g.uniform1f(g.getUniformLocation(p, 'u_time'), 0)
  g.uniform2f(g.getUniformLocation(p, 'u_resolution'), c.width, c.height)
  g.uniform2f(g.getUniformLocation(p, 'u_mouse'), c.width / 2, c.height / 2)
  g.drawArrays(g.TRIANGLE_STRIP, 0, 4)
  document.title = 'done'
})()
</script></body></html>
